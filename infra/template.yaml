AWSTemplateFormatVersion: "2010-09-09"
Description: >
  The Capillary Research Terminal — static site (S3 + CloudFront) plus a daily scraper
  Lambda (EventBridge cron) that refreshes prices and classifies new posts into
  pending_review.json. Read-only tracker: content is populated by the scraper + the
  promote step (infra/promote.sh); there is no user-write path. Sits inside the AWS
  always-free / 12-month-free tiers. See docs/DEPLOY.md.

Parameters:
  ProjectName:
    Type: String
    Default: capillary
  SiteBucketName:
    Type: String
    Description: Globally-unique S3 bucket name for the site + data.json + logs.json.
  ScheduleExpression:
    Type: String
    Default: cron(0 21 * * ? *)
    Description: When the scraper runs (UTC). Default 21:00 UTC = after US + India close.
  GroqParamName:
    Type: String
    Default: /capillary/groq-api-key
  TwelveDataParamName:
    Type: String
    Default: /capillary/twelvedata-api-key
  GroqModel:
    Type: String
    Default: openai/gpt-oss-20b
  DeepDivePassphraseParamName:
    Type: String
    Default: /capillary/deepdive-passphrase
    Description: SSM SecureString holding the shared passphrase that gates the deep-dive generator.

Resources:

  # --- Static hosting ------------------------------------------------------
  SiteBucket:
    Type: AWS::S3::Bucket
    DeletionPolicy: Delete
    Properties:
      BucketName: !Ref SiteBucketName
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      OwnershipControls:
        Rules:
          - ObjectOwnership: BucketOwnerEnforced

  OriginAccessControl:
    Type: AWS::CloudFront::OriginAccessControl
    Properties:
      OriginAccessControlConfig:
        Name: !Sub "${ProjectName}-s3-oac"
        OriginAccessControlOriginType: s3
        SigningBehavior: always
        SigningProtocol: sigv4

  Distribution:
    Type: AWS::CloudFront::Distribution
    Properties:
      DistributionConfig:
        Enabled: true
        Comment: !Sub "${ProjectName} research terminal"
        DefaultRootObject: index.html
        PriceClass: PriceClass_200
        Origins:
          - Id: s3-origin
            DomainName: !GetAtt SiteBucket.RegionalDomainName
            OriginAccessControlId: !Ref OriginAccessControl
            S3OriginConfig:
              OriginAccessIdentity: ""
        DefaultCacheBehavior:
          TargetOriginId: s3-origin
          ViewerProtocolPolicy: redirect-to-https
          AllowedMethods: [GET, HEAD]
          CachePolicyId: 658327ea-f89d-4fab-a63d-7e88639e58f6   # Managed-CachingOptimized
        CacheBehaviors:
          - PathPattern: /data.json
            TargetOriginId: s3-origin
            ViewerProtocolPolicy: redirect-to-https
            AllowedMethods: [GET, HEAD]
            CachePolicyId: 4135ea2d-6df8-44a3-9df3-4b5a84be39ad   # Managed-CachingDisabled
          - PathPattern: /logs.json
            TargetOriginId: s3-origin
            ViewerProtocolPolicy: redirect-to-https
            AllowedMethods: [GET, HEAD]
            CachePolicyId: 4135ea2d-6df8-44a3-9df3-4b5a84be39ad   # Managed-CachingDisabled
          - PathPattern: /config.js
            TargetOriginId: s3-origin
            ViewerProtocolPolicy: redirect-to-https
            AllowedMethods: [GET, HEAD]
            CachePolicyId: 4135ea2d-6df8-44a3-9df3-4b5a84be39ad   # Managed-CachingDisabled (runtime config)
          - PathPattern: /pending_deepdives.json
            TargetOriginId: s3-origin
            ViewerProtocolPolicy: redirect-to-https
            AllowedMethods: [GET, HEAD]
            CachePolicyId: 4135ea2d-6df8-44a3-9df3-4b5a84be39ad   # Managed-CachingDisabled (review queue, always fresh)
          - PathPattern: /pending_review.json
            TargetOriginId: s3-origin
            ViewerProtocolPolicy: redirect-to-https
            AllowedMethods: [GET, HEAD]
            CachePolicyId: 4135ea2d-6df8-44a3-9df3-4b5a84be39ad   # Managed-CachingDisabled (scraper draft queue, always fresh)

  SiteBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref SiteBucket
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Sid: AllowCloudFrontRead
            Effect: Allow
            Principal:
              Service: cloudfront.amazonaws.com
            Action: s3:GetObject
            Resource: !Sub "${SiteBucket.Arn}/*"
            Condition:
              StringEquals:
                AWS:SourceArn: !Sub "arn:aws:cloudfront::${AWS::AccountId}:distribution/${Distribution}"

  # --- Scraper (daily cron) ------------------------------------------------
  ScraperRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal: { Service: lambda.amazonaws.com }
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
      Policies:
        - PolicyName: s3-data-rw
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action: [s3:GetObject, s3:PutObject]
                Resource: !Sub "${SiteBucket.Arn}/*"
        - PolicyName: read-secrets
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action: ssm:GetParameter
                Resource:
                  - !Sub "arn:aws:ssm:${AWS::Region}:${AWS::AccountId}:parameter${GroqParamName}"
                  - !Sub "arn:aws:ssm:${AWS::Region}:${AWS::AccountId}:parameter${TwelveDataParamName}"
              - Effect: Allow
                Action: kms:Decrypt
                Resource: "*"
                Condition:
                  StringEquals:
                    kms:ViaService: !Sub "ssm.${AWS::Region}.amazonaws.com"

  ScraperFunction:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: !Sub "${ProjectName}-scraper"
      Runtime: python3.12
      Handler: scraper.lambda_handler
      Role: !GetAtt ScraperRole.Arn
      Timeout: 600
      MemorySize: 256
      Code: ../lambda
      Environment:
        Variables:
          DATA_BUCKET: !Ref SiteBucket
          GROQ_PARAM: !Ref GroqParamName
          TWELVEDATA_PARAM: !Ref TwelveDataParamName
          GROQ_MODEL: !Ref GroqModel

  ScheduleRule:
    Type: AWS::Events::Rule
    Properties:
      Name: !Sub "${ProjectName}-daily-scrape"
      ScheduleExpression: !Ref ScheduleExpression
      State: ENABLED
      Targets:
        - Id: scraper
          Arn: !GetAtt ScraperFunction.Arn

  SchedulePermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref ScraperFunction
      Action: lambda:InvokeFunction
      Principal: events.amazonaws.com
      SourceArn: !GetAtt ScheduleRule.Arn

  # --- Deep Dive generator (on-demand, behind an HTTP API) -----------------
  # A live "Add a Deep Dive" button on the site POSTs a ticker here. The Lambda
  # checks a passphrase, looks up the price/name, asks Groq for an 11-stage
  # analysis, and writes it to pending_deepdives.json (a review queue — NOT live).
  GeneratorRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal: { Service: lambda.amazonaws.com }
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
      Policies:
        - PolicyName: s3-data-rw
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action: [s3:GetObject, s3:PutObject]
                Resource: !Sub "${SiteBucket.Arn}/*"
        - PolicyName: read-secrets
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action: ssm:GetParameter
                Resource:
                  - !Sub "arn:aws:ssm:${AWS::Region}:${AWS::AccountId}:parameter${GroqParamName}"
                  - !Sub "arn:aws:ssm:${AWS::Region}:${AWS::AccountId}:parameter${TwelveDataParamName}"
                  - !Sub "arn:aws:ssm:${AWS::Region}:${AWS::AccountId}:parameter${DeepDivePassphraseParamName}"
              - Effect: Allow
                Action: kms:Decrypt
                Resource: "*"
                Condition:
                  StringEquals:
                    kms:ViaService: !Sub "ssm.${AWS::Region}.amazonaws.com"

  GeneratorFunction:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: !Sub "${ProjectName}-deepdive-generator"
      Runtime: python3.12
      Handler: deepdive.lambda_handler
      Role: !GetAtt GeneratorRole.Arn
      Timeout: 240
      MemorySize: 256
      Code: ../lambda
      Environment:
        Variables:
          DATA_BUCKET: !Ref SiteBucket
          GROQ_PARAM: !Ref GroqParamName
          TWELVEDATA_PARAM: !Ref TwelveDataParamName
          GROQ_MODEL: !Ref GroqModel
          DEEPDIVE_PASSPHRASE_PARAM: !Ref DeepDivePassphraseParamName

  DeepDiveApi:
    Type: AWS::ApiGatewayV2::Api
    Properties:
      Name: !Sub "${ProjectName}-deepdive-api"
      ProtocolType: HTTP
      CorsConfiguration:
        AllowOrigins: ["*"]
        AllowMethods: [POST, OPTIONS]
        AllowHeaders: [content-type]
        MaxAge: 300

  DeepDiveIntegration:
    Type: AWS::ApiGatewayV2::Integration
    Properties:
      ApiId: !Ref DeepDiveApi
      IntegrationType: AWS_PROXY
      IntegrationUri: !GetAtt GeneratorFunction.Arn
      PayloadFormatVersion: "2.0"

  DeepDiveRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref DeepDiveApi
      RouteKey: "POST /deepdive"
      Target: !Sub "integrations/${DeepDiveIntegration}"

  DeepDiveApproveRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref DeepDiveApi
      RouteKey: "POST /deepdive/approve"
      Target: !Sub "integrations/${DeepDiveIntegration}"

  DeepDiveRejectRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref DeepDiveApi
      RouteKey: "POST /deepdive/reject"
      Target: !Sub "integrations/${DeepDiveIntegration}"

  ReviewApproveRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref DeepDiveApi
      RouteKey: "POST /review/approve"
      Target: !Sub "integrations/${DeepDiveIntegration}"

  ReviewRejectRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref DeepDiveApi
      RouteKey: "POST /review/reject"
      Target: !Sub "integrations/${DeepDiveIntegration}"

  DeepDiveStage:
    Type: AWS::ApiGatewayV2::Stage
    Properties:
      ApiId: !Ref DeepDiveApi
      StageName: "$default"
      AutoDeploy: true

  DeepDiveInvokePermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref GeneratorFunction
      Action: lambda:InvokeFunction
      Principal: apigateway.amazonaws.com
      SourceArn: !Sub "arn:aws:execute-api:${AWS::Region}:${AWS::AccountId}:${DeepDiveApi}/*"

Outputs:
  SiteURL:
    Description: Public HTTPS URL of the tracker.
    Value: !Sub "https://${Distribution.DomainName}"
  DistributionId:
    Description: CloudFront distribution id (for cache invalidations).
    Value: !Ref Distribution
  SiteBucketName:
    Value: !Ref SiteBucket
  ScraperFunctionName:
    Value: !Ref ScraperFunction
  DeepDiveApiUrl:
    Description: Invoke URL for the deep-dive generator (POST here from the site).
    Value: !Sub "https://${DeepDiveApi}.execute-api.${AWS::Region}.amazonaws.com/deepdive"
